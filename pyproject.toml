[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opteryx-upload"
version = "0.3.0"
description = "Client SDK for the Opteryx Upload Service"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.34.2,<3",
]

[project.optional-dependencies]
# gzip comes from the standard library, so compression works with no extras;
# zstd is denser and faster, and is picked automatically when it is installed.
zstd = [
    "zstandard>=0.22,<1",
]
dev = [
    "pytest>=7",
    "responses>=0.23",
    "zstandard>=0.22,<1",
]

[project.urls]
Homepage = "https://github.com/mabel-dev/opteryx-upload"

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py39'
